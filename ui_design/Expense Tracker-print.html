<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker — Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    font-family: 'Sarabun', system-ui, -apple-system, sans-serif;
    background: #DDD6C6;
    color: #1F1B16;
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  *, *::before, *::after { box-sizing: border-box; }
  input, button { font-family: inherit; }

  .print-page {
    width: 1100px;
    margin: 0 auto;
    background: #F4EFE6;
    padding: 36px 40px 48px;
    min-height: 100vh;
  }
  .print-page + .print-page { margin-top: 32px; }
  .page-header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 18px; margin-bottom: 22px;
    border-bottom: 1px solid rgba(31,27,22,0.1);
  }
  .page-header .title {
    font-size: 26px; font-weight: 700; letter-spacing: -0.4px; color: #1F1B16;
  }
  .page-header .meta {
    font-size: 13px; color: #7A7064;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 17px; font-weight: 800; letter-spacing: -0.3px;
  }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: oklch(48% 0.10 195);
    color: #FFFCF7;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
  }

  @page {
    size: A4;
    margin: 12mm;
  }
  @media print {
    body { background: #FFFFFF !important; }
    .print-page {
      width: 100%;
      margin: 0;
      padding: 0;
      min-height: 0;
      background: transparent;
      break-before: page;
      break-inside: avoid;
    }
    .print-page:first-child { break-before: auto; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script>window.__SUPPRESS_AUTO_MOUNT = true;</script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="add-screen.jsx"></script>
  <script type="text/babel" src="stats-screen.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel">
    function PrintShell() {
      const theme = makeTheme({ theme: 'cream', accent: 'teal' });
      const monthIdx = 4; // May
      const txns = SAMPLE_TXNS;

      const pageStyle = { background: theme.bg, color: theme.ink };

      return (
        <>
          {/* Page 1 — Home */}
          <section className="print-page" style={pageStyle}>
            <div className="page-header">
              <div className="brand">
                <span className="brand-mark">฿</span>
                Expense <span style={{ color: theme.accent, marginLeft: 4 }}>Tracker</span>
              </div>
              <div>
                <div className="title">หน้าหลัก · พฤษภาคม 2569</div>
              </div>
              <div className="meta">คุณนภัส</div>
            </div>
            <HomeScreen
              txns={txns}
              monthIdx={monthIdx}
              onMonthChange={() => {}}
              theme={theme}
              density="comfortable"
              isDesktop={true}
              onAdd={() => {}}
              onDelete={() => {}}
            />
          </section>

          {/* Page 2 — Stats */}
          <section className="print-page" style={pageStyle}>
            <div className="page-header">
              <div className="brand">
                <span className="brand-mark">฿</span>
                Expense <span style={{ color: theme.accent, marginLeft: 4 }}>Tracker</span>
              </div>
              <div>
                <div className="title">Dashboard สถิติ</div>
              </div>
              <div className="meta">พฤษภาคม 2569</div>
            </div>
            <StatsScreen
              txns={txns}
              theme={theme}
              isDesktop={true}
              monthIdx={monthIdx}
            />
          </section>

          {/* Page 3 — Add */}
          <section className="print-page" style={pageStyle}>
            <div className="page-header">
              <div className="brand">
                <span className="brand-mark">฿</span>
                Expense <span style={{ color: theme.accent, marginLeft: 4 }}>Tracker</span>
              </div>
              <div>
                <div className="title">หน้าเพิ่มรายการ</div>
              </div>
              <div className="meta">รายจ่าย / รายรับ</div>
            </div>
            <AddScreen
              onSave={() => {}}
              onCancel={() => {}}
              theme={theme}
              isDesktop={true}
            />
          </section>
        </>
      );
    }

    // Wait for Babel to parse all the previous scripts and define window.HomeScreen, etc.
    function tryMount() {
      if (typeof HomeScreen === 'undefined' ||
          typeof StatsScreen === 'undefined' ||
          typeof AddScreen === 'undefined' ||
          typeof makeTheme === 'undefined' ||
          typeof SAMPLE_TXNS === 'undefined') {
        setTimeout(tryMount, 60);
        return;
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<PrintShell />);

      // Auto-print: wait for fonts + a moment for layout
      Promise.resolve(document.fonts && document.fonts.ready)
        .then(() => new Promise(r => setTimeout(r, 500)))
        .then(() => { window.print(); });
    }
    tryMount();
  </script>
</body>
</html>
